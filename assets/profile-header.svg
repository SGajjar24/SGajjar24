<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070710" />
      <stop offset="50%" stop-color="#0a0a18" />
      <stop offset="100%" stop-color="#12061e" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 217, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#bg-grad)" rx="12" />
  
  <!-- Subtle Grid overlay -->
  <rect width="1200" height="220" fill="url(#grid)" rx="12" />

  <!-- Animated-like neon gradients -->
  <path d="M 0 0 Q 300 240 600 120 T 1200 240 L 1200 0 Z" fill="rgba(139, 92, 246, 0.04)" />
  <path d="M 0 220 Q 300 0 600 100 T 1200 0 L 1200 220 Z" fill="rgba(0, 217, 255, 0.02)" />

  <!-- Neon border line at the bottom -->
  <rect x="0" y="216" width="1200" height="4" fill="url(#accent-grad)" />

  <!-- Corner Accents -->
  <path d="M 20 20 L 50 20 M 20 20 L 20 50" fill="none" stroke="#00D9FF" stroke-width="3" opacity="0.8" />
  <path d="M 1180 20 L 1150 20 M 1180 20 L 1180 50" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.8" />
  <path d="M 20 200 L 50 200 M 20 200 L 20 170" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.8" />
  <path d="M 1180 200 L 1150 200 M 1180 200 L 1180 170" fill="none" stroke="#00D9FF" stroke-width="3" opacity="0.8" />

  <!-- Title Text -->
  <text x="600" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF" text-anchor="middle" letter-spacing="12" filter="url(#glow)">
    SWETANG GAJJAR
  </text>
  
  <!-- Subtitle Text -->
  <text x="600" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="16" fill="#00D9FF" text-anchor="middle" letter-spacing="4">
    SENIOR AI/ML ARCHITECT <tspan fill="#8B5CF6">|</tspan> SYSTEMS ENGINEER
  </text>

  <!-- Glowing underline -->
  <rect x="420" y="124" width="360" height="2" fill="url(#accent-grad)" opacity="0.7" />

  <!-- Systems Indicators -->
  <text x="60" y="195" font-family="'Courier New', Courier, monospace" font-size="11" fill="rgba(0, 217, 255, 0.45)">
    SECURE_NODE: ACTIVE // MIL-STD-130N
  </text>
  <text x="1140" y="195" font-family="'Courier New', Courier, monospace" font-size="11" fill="rgba(139, 92, 246, 0.45)" text-anchor="end">
    SYS_INTEGRITY: 100% // ITAR_REG
  </text>
</svg>