<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070710" />
      <stop offset="100%" stop-color="#12061e" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <path d="M 0 35 L 1200 0 L 1200 80 L 0 80 Z" fill="url(#bg-grad)" />
  
  <!-- Laser line divider -->
  <line x1="0" y1="35" x2="1200" y2="0" stroke="url(#accent-grad)" stroke-width="3" />
  
  <!-- Footer text -->
  <text x="600" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="rgba(255, 255, 255, 0.35)" text-anchor="middle" letter-spacing="4">
    BRIDGING MILITARY-GRADE RELIABILITY WITH ADVANCED AGENTIC INTELLIGENCE
  </text>
</svg>